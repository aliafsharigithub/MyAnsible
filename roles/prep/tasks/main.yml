---
- name: --- making sure Python is present ---
  yum:
    name: python
    state: latest
  when: ansible_facts['os_family'] == "RedHat"
  tags: RedPython

- name: --- making sure python is present ---
  apt:
    name: python
    state: latest
    update_cache: yes
  when: ansible_facts['os_family'] == "Debian"
  tags: UbuPython

